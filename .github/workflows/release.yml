name: Build and Publish Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-release-key.jks

      - name: Build with Gradle
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon -Djava.awt.headless=true
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Rename Artifacts
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/travelarm-release.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/travelarm-release.aab

      - name: Read Version Info from version.json
        id: version_info
        run: |
          VERSION=$(jq -r '.latestVersionName' version.json)
          NOTES=$(jq -r '.releaseNotes' version.json)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NOTES=$NOTES" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Travelarm v${{ env.APP_VERSION }}"
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/travelarm-release.apk
            app/build/outputs/bundle/release/travelarm-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
